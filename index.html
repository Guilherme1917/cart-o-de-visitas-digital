    :root {
      --white: #ffffff;
      --black: #0a0a0a;

      --blue: #2563eb;

      --blue-dark: #1d4ed8;

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--black);
      color: var(--white);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 50% -10%, var(--blue-glow), transparent 55%),
        radial-gradient(circle at 85% 100%, rgba(37,99,235,0.08), transparent 50%);
      pointer-events: none;
    }
    .cartao {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--black-soft);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--r-xl);
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 40px 80px rgba(0,0,0,0.55);
      z-index: 1;
    }
    .cartao-tag {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blue-light);
      margin-bottom: 20px;
    }
    .avatar {
      width: 116px; height: 116px;
      margin: 0 auto 18px;
      padding: 4px;
      border-radius: var(--r-xl);
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      box-shadow: 0 12px 32px rgba(37,99,235,0.35);
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: calc(var(--r-xl) - 4px);
      display: block;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--blue-light); }
    .role {
      margin-top: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--white);
    }
    .local {
      margin-top: 4px;
      font-size: 0.85rem;
      color: var(--gray-400);
    }
    .resumo {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--gray-400);
    }
    .acoes { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: var(--r-full);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primario { background: var(--blue); color: var(--white); box-shadow: 0 10px 24px rgba(37,99,235,0.35); }
    .btn-primario:hover { background: var(--blue-dark); }
    .btn-secundario { background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,0.18); }
    .btn-secundario:hover { border-color: var(--blue-light); color: var(--blue-light); }
    .btn-site {
      margin-top: 2px;
      font-size: 0.88rem;
      color: var(--blue-light);
      border: 1.5px dashed rgba(59,130,246,0.45);
    }
    .icones { margin-top: 22px; display: flex; justify-content: center; gap: 12px; }
    .icone {
      width: 44px; height: 44px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--r-full);
      border: 1.5px solid rgba(255,255,255,0.14);
      color: var(--white);
      text-decoration: none;
      font-size: 1.1rem;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .icone:hover { border-color: var(--blue-light); color: var(--blue-light); transform: translateY(-2px); }
    .icone svg { width: 20px; height: 20px; fill: currentColor; }
    .rodape {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--gray-400);
      letter-spacing: 0.04em;
    }
    @media (max-width: 380px) {
      .cartao { padding: 32px 20px 26px; }
      h1 { font-size: 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn, .icone { transition: none; }
      .btn:hover, .icone:hover { transform: none; }
    }
